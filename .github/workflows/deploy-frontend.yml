name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - development  # triggers on push to development

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json  # adjust path

      # - name: Install dependencies
      #   working-directory: ./frontend  # adjust to your frontend folder
      #   run: npm ci

      # - name: Build
      #   working-directory: ./frontend  # adjust to your frontend folder
      #   run: npm run build
        env:
          # Add any frontend-only env vars here (no backend secrets!)
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # adjust to your build output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4